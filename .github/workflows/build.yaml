name: Build Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка Flutter SDK (3.29.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Установка Linux-зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Принятие лицензий Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Установка Flet CLI
        run: pip install flet==0.28.3

      - name: Зачистка кэшей и удаление pyproject.toml
        run: |
          rm -rf flet-config.json flet.json python_debug_log.txt
          rm -rf .flet build output_apk
          rm -f pyproject.toml

      - name: Сборка АРК для диагностики
        env:
          SERIOUS_PYTHON_VERSION: '3.11'
        run: flet build apk --module-name main_test -v

      - name: Штамп по Киеву
        run: echo "APK_TIMESTAMP=$(TZ='Europe/Kyiv' date +'%d_%m_%Y_%H_%M')" >> $GITHUB_ENV

      - name: Переименование
        run: |
          mkdir -p output_apk
          cp build/apk/*.apk output_apk/Bortovoj_Zhurnal_TEST_${{ env.APK_TIMESTAMP }}.apk

      - name: Выгрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Bortovoj_Zhurnal_TEST_${{ env.APK_TIMESTAMP }}
          path: output_apk/*.apk