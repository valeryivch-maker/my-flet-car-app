name: Build Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка Flutter SDK (3.29.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Установка Linux-зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Принятие лицензий Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Установка Flet CLI
        run: pip install flet==0.28.3

      - name: Зачистка кэшей и фикс pyproject.toml
        run: |
          rm -rf flet-config.json flet.json python_debug_log.txt
          rm -rf .flet build output_apk
          sed -i '1s/^\xEF\xBB\xBF//' pyproject.toml

      - name: Подготовка network.py с подстановкой секретов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "network_template.py" ]; then
            cp network_template.py network.py
            sed -i "s/{{ TELEGRAM_BOT_TOKEN }}/$TELEGRAM_BOT_TOKEN/g" network.py
            sed -i "s/{{ TELEGRAM_CHAT_ID }}/$TELEGRAM_CHAT_ID/g" network.py
            sed -i 's|https://telegram.org|https://149.154.167.220|g' network.py
          fi

      - name: Создание requirements.txt
        run: |
          printf "requests==2.32.3\ncertifi==2024.7.4\nurllib3==2.2.2\nplyer==2.1.0\n" > requirements.txt

      - name: Сборка АРК (Боевая)
        env:
          SERIOUS_PYTHON_VERSION: '3.11'
        run: flet build apk -v

      - name: Штамп по Киеву
        run: echo "APK_TIMESTAMP=$(TZ='Europe/Kyiv' date +'%d_%m_%Y_%H_%M')" >> $GITHUB_ENV

      - name: Переименование
        run: |
          mkdir -p output_apk
          cp build/apk/*.apk output_apk/Bortovoj_Zhurnal_${{ env.APK_TIMESTAMP }}.apk

      - name: Выгрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: Bortovoj_Zhurnal_${{ env.APK_TIMESTAMP }}
          path: output_apk/*.apk