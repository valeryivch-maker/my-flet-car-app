name: Build Android Release (100% Offline WebView CORS Patched)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Настройка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: 1. Установка компилятора Flet CLI
        run: pip install flet==0.23.2 requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2

      - name: 2. Компиляция Python-кода в HTML
        run: |
          mkdir -p .tmp_web_payload
          python -c "
          import os, shutil
          dest = '.tmp_web_payload'
          for item in os.listdir('.'):
              if item in ['build_flutter', '.github', '.git', '.tmp_web_payload', 'gradle_pip_placeholder']: continue
              if os.path.isfile(item): shutil.copy2(item, os.path.join(dest, item))
              elif os.path.isdir(item): shutil.copytree(item, os.path.join(dest, item), ignore=shutil.ignore_patterns('*.pyc', '__pycache__'), dirs_exist_ok=True)
          "
          cd .tmp_web_payload && flet publish main.py --web-renderer html --base-url ./ --distpath ../flet_web_dist
          cd .. && rm -rf .tmp_web_payload

      - name: 3. Создаем Flutter проект
        run: flutter create --template=app --org com.example --project-name=flet_android --platforms=android build_flutter

      - name: 4. Подключаем webview и shelf
        run: cd build_flutter && flutter pub add webview_flutter webview_flutter_android shelf

      - name: 5. Инъекция дистрибутива в ассеты
        run: mkdir -p build_flutter/assets/www && cp -r flet_web_dist/* build_flutter/assets/www/

      - name: 5.5. Безопасный текстовый патч AndroidManifest через Python
        run: |
          python -c "
          path = 'build_flutter/android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
          
          out = []
          for line in lines:
              if '</manifest>' in line:
                  out.append('    <uses-permission android:name=\"android.permission.INTERNET\"/>\n')
              if '<application' in line and 'android:usesCleartextTraffic' not in line:
                  line = line.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
              out.append(line)
          
          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(out)
          "
          echo "[УСПЕХ] Строковые параметры сети и loopback-трафика успешно инжектированы."
      - name: 6. Инъекция безопасного фонового сервера Shelf в main.dart
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart' show rootBundle;
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';
          import 'package:shelf/shelf.dart';
          import 'package:shelf/shelf_io.dart' as io;
          import 'dart:io';
          import 'dart:typed_data';
          import 'dart:async';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            Future<Response> assetHandler(Request request) async {
              try {
                String path = request.url.path;
                if (path.isEmpty || path == '/') path = 'index.html';
                final String assetKey = 'assets/www/$path';
                final ByteData bytes = await rootBundle.load(assetKey);
                final Uint8List list = bytes.buffer.asUint8List();
                String contentType = 'text/html';
                if (path.endsWith('.js')) contentType = 'application/javascript';
                if (path.endsWith('.css')) contentType = 'text/css';
                if (path.endsWith('.png')) contentType = 'image/png';
                if (path.endsWith('.wasm')) contentType = 'application/wasm';
                return Response.ok(list, headers: {'Content-Type': contentType, 'Access-Control-Allow-Origin': '*'});
              } catch (e) { return Response.notFound('Ресурс не найден'); }
            }
            try { await io.serve(assetHandler, InternetAddress.loopbackIPv4, 9999); } catch (e) {}
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Журнал ТО',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.amber),
                home: const WebViewContainer(),
              );
            }
          }

          class WebViewContainer extends StatefulWidget {
            const WebViewContainer({super.key});
            @override
            State<WebViewContainer> createState() => _WebViewContainerState();
          }

          class _WebViewContainerState extends State<WebViewContainer> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(NavigationDelegate(onPageFinished: (url) { setState(() { _isLoading = false; }); }));
              if (_controller.platform is AndroidWebViewController) {
                final c = _controller.platform as AndroidWebViewController;
                c.setMediaPlaybackRequiresUserGesture(false);
                AndroidWebViewController.enableDebugging(true);
              }
              _controller.loadRequest(Uri.parse('http://127.0.0'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF1E1E1E),
                body: SafeArea(child: Stack(children: [
                  WebViewWidget(controller: _controller),
                  if (_isLoading) const Center(child: CircularProgressIndicator(color: Colors.amber)),
                ])),
              );
            }
          }
          EOF

      - name: 7. Генерация pubspec.yaml
        run: |
          cd build_flutter && rm -f pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: flet_android
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
            webview_flutter_android: ^4.12.0
            shelf: ^1.4.1
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/www/
          EOF
          cd assets/www
          find . -type d | while read -r dir; do
            if [ "$dir" != "." ]; then
              clean_dir=$(echo "$dir" | cut -c 3-)
              echo "    - assets/www/${clean_dir}/" >> ../../pubspec.yaml
            fi
          done

      - name: 7.5. Патч совместимости AGP
        run: |
          cd build_flutter/android
          cat << 'EOF' >> build.gradle
          subprojects {
              project.repositories { google(); mavenCentral() }
              afterEvaluate { project ->
                  if (project.hasProperty("android") && project.android.namespace == null) {
                      project.android.namespace = project.android.hasProperty("defaultConfig") && project.android.defaultConfig.applicationId != null ? project.android.defaultConfig.applicationId : "com.pichillilorenzo.flutter_inappwebview"
                  }
              }
          }
          EOF

      - name: 8. Компиляция Gradle
        run: |
          cd build_flutter && flutter pub get
          cd android && chmod +x gradlew && ./gradlew clean && ./gradlew assembleRelease

      - name: 9. Выгрузка готового APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_flutter/android/app/build/outputs/apk/release/app-release.apk
