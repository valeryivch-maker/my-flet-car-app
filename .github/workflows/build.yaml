name: Build Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Откатываемся на старый образ, который лучше дружит с Flutter 3.19
    runs-on: ubuntu-20.04
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка Flutter SDK (3.19.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Установка Linux-зависимостей для сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Установка Flet CLI
        run: pip install flet==0.23.2

      - name: Зачистка старых кэшей сборки
        run: |
          rm -rf flet-config.json flet.json python_debug_log.txt
          rm -rf .flet build output_apk

      - name: Подготовка network.py с подстановкой секретов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "network_template.py" ]; then
            cp network_template.py network.py
            sed -i "s/{{ TELEGRAM_BOT_TOKEN }}/$TELEGRAM_BOT_TOKEN/g" network.py
            sed -i "s/{{ TELEGRAM_CHAT_ID }}/$TELEGRAM_CHAT_ID/g" network.py
            sed -i 's|https://telegram.org|https://149.154.167.220|g' network.py
          fi

      - name: Создание requirements.txt
        run: |
          cat << 'EOF' > requirements.txt
          requests==2.32.3
          certifi==2024.7.4
          urllib3==2.2.2
          plyer==2.1.0
          EOF

      - name: Создание pyproject.toml с настройками Android
        run: |
          cat << 'EOF' > pyproject.toml
          [tool.flet]
          product = "Бортовой Журнал"
          package = "com.flet.carjournal"
          version = "1.2.6"
          build_number = 12

          [tool.flet.app]
          main_script = "main.py"

          [tool.flet.android]
          min_sdk_version = 21
          EOF

      - name: Сборка APK (с явным указанием пути к Flutter)
        env:
          # Это заставит Flet использовать установленный Flutter, а не искать его самому
          FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.19.6-x64
        run: |
          flet build apk -v

      - name: Сохранение APK как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: carjournal-apk
          path: build/apk/*.apk