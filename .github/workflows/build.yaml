name: Build Android Release (100% Offline WebView CORS Patched)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4
      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Настройка Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
      - name: 1. Установка компилятора Flet CLI в Linux-окружение
        run: pip install flet==0.23.2 requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2
      - name: 2. Подготовка и компиляция Python-кода в легкий раздельный веб-бандл
        run: |
          mkdir -p .tmp_web_payload
          python -c "
          import os, shutil
          dest = '.tmp_web_payload'
          for item in os.listdir('.'):
              if item in ['build_flutter', '.github', '.git', '.tmp_web_payload', 'gradle_pip_placeholder']: continue
              if os.path.isfile(item): shutil.copy2(item, os.path.join(dest, item))
              elif os.path.isdir(item): shutil.copytree(item, os.path.join(dest, item), ignore=shutil.ignore_patterns('*.pyc', '__pycache__'), dirs_exist_ok=True)
          "
          cd .tmp_web_payload
          flet publish main.py --web-renderer html --base-url ./ --distpath ../flet_web_dist
          cd ..
          rm -rf .tmp_web_payload
      - name: 3. Создаем чистый Flutter проект с фиксацией ID организации
        run: flutter create --template=app --org com.example --project-name=flet_android --platforms=android build_flutter
      - name: 4. Подключаем официальный веб-сервер shelf и плагины статики ассетов
        run: |
          cd build_flutter
          flutter pub add webview_flutter
          flutter pub add webview_flutter_android
          flutter pub add shelf
          # Исправлена маска версии плагина на основе вывода линкера pub
          flutter pub add shelf_flutter_asset:^0.1.0
      - name: 5. Инъекция автономного дистрибутива в ассеты мобильного приложения
        run: |
          mkdir -p build_flutter/assets/www
          cp -r flet_web_dist/* build_flutter/assets/www/
      - name: 5.5. Патч AndroidManifest (Включение прав сети и флага CleartextTraffic)
        run: |
          python -c "
          path = 'build_flutter/android/app/src/main/AndroidManifest.xml'
          with open(path, 'r', encoding='utf-8') as f:
              text = f.read()
          
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic=\"true\"')
          if 'android.permission.INTERNET' not in text:
              text = text.replace('</manifest>', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n</manifest>')
          
          with open(path, 'w', encoding='utf-8') as f:
              f.write(text)
          "
      - name: 6. Инъекция канонического shelf_flutter_asset сервера в main.dart
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:shelf/shelf.dart';
          import 'package:shelf/shelf_io.dart' as io;
          import 'package:shelf_flutter_asset/shelf_flutter_asset.dart';
          import 'dart:io';
          
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            
            final assetHandler = createAssetHandler(
              basePath: 'assets/www',
              defaultDocument: 'index.html',
            );
            
            final pipeline = const Pipeline()
                .addMiddleware((innerHandler) {
                  return (request) async {
                    final response = await innerHandler(request);
                    return response.change(headers: {
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
                    });
                  };
                })
                .addHandler(assetHandler);
                
            try {
              await io.serve(pipeline, InternetAddress.loopbackIPv4, 9999);
            } catch (e) {
              debugPrint('Ошибка инициализации shelf: $e');
            }
            
            runApp(const MyApp());
          }
          
          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Журнал ТО',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.amber),
                home: const WebViewContainer(),
              );
            }
          }
          class WebViewContainer extends StatefulWidget {
            const WebViewContainer({super.key});
            @override
            State<WebViewContainer> createState() => _WebViewContainerState();
          }
          class _WebViewContainerState extends State<WebViewContainer> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted);
                
              _controller.clearCache();
              _controller.clearLocalStorage();
              _controller.loadRequest(Uri.parse('http://127.0.0.1:9999'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF1E1E1E),
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          EOF
      - name: 7. Generation pubspec.yaml
        run: |
          cd build_flutter && rm -f pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: flet_android
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
            webview_flutter_android: ^4.12.0
            shelf: ^1.4.1
            shelf_flutter_asset: ^0.1.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
            assets:
              - assets/www/
          EOF
          cd assets/www
          find . -type d | while read -r dir; do
            if [ "$dir" != "." ]; then
              clean_dir=$(echo "$dir" | cut -c 3-)
              echo "    - assets/www/${clean_dir}/" >> ../../pubspec.yaml
            fi
          done
      - name: 8. Нативная компиляция через стабильный Gradle-враппер
        run: |
          cd build_flutter
          flutter pub get
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease
      - name: 9. Выгрузка готового APK из канонической корневой папки Flutter build
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_flutter/build/app/outputs/flutter-apk/*.apk
