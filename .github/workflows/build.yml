
name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Фиксируем стабильную вчерашнюю версию Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # Разворачиваем Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Toolchain Dependencies (GTK 3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      # Фиксируем чистую стабильную версию Flet без флагов pre-release версий
      - name: Install Flet with CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[cli]==0.23.2"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # Очищаем репозиторий от мусора
      - name: Hard Purge Non-Core Python Files
        run: |
          rm -rf build_flutter
          rm -f app.py
          rm -f cron_weekly_check.py
          rm -f patch*.py
          rm -f generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены."

      # Запускаем сборку Flet с синтаксисом аргументов версии 0.23.2
      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # В версии 0.23.2 нет флагов --python-version и --yes, запускаем в чистом режиме
          flet build apk -v
          
      # Выгружаем настоящий собранный Flet APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-journal-apk
          path: build/apk/*.apk
