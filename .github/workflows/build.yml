name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Фиксируем стабильную версию Flutter, под которую написан проект
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # Разворачиваем целевой Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Toolchain Dependencies (GTK 3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      # Устанавливаем стабильный релиз CLI и добавляем PyInstaller для проверки flet pack
      - name: Install Flet with CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[cli]==0.27.3" pyinstaller

      # Принимаем лицензии Android SDK
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # Удаляем второстепенные скрипты перед компиляцией
      - name: Hard Purge Non-Core Python Files
        run: |
          rm -f app.py
          rm -f cron_weekly_check.py
          rm -f patch*.py
          rm -f generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены."

      # Упаковываем исходники и собираем проект нативным компилятором Flutter
      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # 1. Упаковываем проект в zip-архив исходников с флагом фонового воркера
          flet pack main.py --worker
          
          # 2. Вызываем официальный стабильный Flutter 3.41.7 для сборки финального APK
          flutter build apk --release
