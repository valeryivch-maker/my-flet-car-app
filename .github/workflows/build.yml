
name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Фиксируем стабильную версию Flutter, под которую написан проект
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # Разворачиваем целевой Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Принимаем лицензии Android SDK
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # Удаляем второстепенные скрипты перед компиляцией
      - name: Hard Purge Non-Core Python Files
        run: |
          rm -f app.py
          rm -f cron_weekly_check.py
          rm -f patch*.py
          rm -f generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены."

      # Упаковываем исходники стандартным Python и собираем проект нативным компилятором Flutter
      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # 1. Создаем структуру каталогов, которую ожидает Serious Python во Flutter
          mkdir -p build/flutter/assets
          
          # 2. Нативно и без внешних CLI-утилит упаковываем весь проект в app.zip
          python -c "
          import zipfile, os
          with zipfile.ZipFile('build/flutter/assets/app.zip', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('.'):
                  if 'build' in root or '.github' in root or '.git' in root:
                      continue
                  for file in files:
                      if file.endswith('.py') or file.endswith('.json') or file.endswith('.txt'):
                          fp = os.path.join(root, file)
                          zipf.write(fp, os.path.relpath(fp, '.'))
          print('[УСПЕХ] Исходники упакованы в app.zip')
          "
          
          # 3. Вызываем официальный стабильный Flutter 3.41.7 для сборки финального APK
          flutter build apk --release
