name: Build Android Release (Flet Native)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Flutter (Фиксированная версия)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. Создаем чистый Flutter проект
        run: |
          flutter create --template=app --platforms=android build_flutter

      - name: 2. Подключаем плагин serious_python
        run: |
          cd build_flutter
          flutter pub add serious_python

      - name: 3. Тотальное затирание и перезапись main.dart
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';
          
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run("assets/app/app.zip");
          }
          EOF

      - name: 4. Скачивание зависимостей Pip в структуру ассетов
        run: |
          mkdir -p build_flutter/assets/app
          pip install requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2 flet-embed==0.23.2 --target build_flutter/assets/app/site-packages

      - name: 5. Упаковка Python-кода и site-packages в единый app.zip
        run: |
          python -c "
          import zipfile, os
          with zipfile.ZipFile('build_flutter/assets/app/app.zip', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('.'):
                  if 'build_flutter' in root or '.github' in root or '.git' in root:
                      continue
                  for file in files:
                      if file.endswith('.py') or file.endswith('.json') or file.endswith('.txt'):
                          fp = os.path.join(root, file)
                          zipf.write(fp, os.path.relpath(fp, '.'))
              
              sp_dir = 'build_flutter/assets/app/site-packages'
              for root, dirs, files in os.walk(sp_dir):
                  for file in files:
                      fp = os.path.join(root, file)
                      arc_name = os.path.relpath(fp, sp_dir)
                      zipf.write(fp, arc_name)
          print('[УСПЕХ] Python-код и все зависимости упакованы в app.zip.')
          "

      - name: 6. Очистка временных папок
        run: |
          mkdir -p gradle_pip_placeholder
          rm -rf build_flutter/assets/app/site-packages

      - name: 7. Полная перезапись pubspec.yaml с гарантированной регистрацией ассетов
        run: |
          rm -f build_flutter/pubspec.yaml
          cat << 'EOF' > build_flutter/pubspec.yaml
          name: build_flutter
          description: "A new Flutter project."
          publish_to: 'none'
          version: 1.0.0+1
          
          environment:
            sdk: ^3.41.7
          
          dependencies:
            flutter:
              sdk: flutter
            serious_python: ^4.5.1
          
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          
          flutter:
            uses-material-design: true
            assets:
              - assets/app/app.zip
          EOF

      - name: 8. Компиляция стабильного Android APK
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/gradle_pip_placeholder"
        run: |
          cd build_flutter
          flutter build apk --release

      - name: 9. Выгрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_flutter/build/app/outputs/flutter-apk/app-release.apk
