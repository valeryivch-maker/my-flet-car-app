name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Toolchain Dependencies (GTK 3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install Flet with CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[cli]"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Hard Purge Non-Core Python Files
        run: |
          rm -f app.py
          rm -f cron_weekly_check.py
          rm -f patch*.py
          rm -f generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены перед сборкой хуков."

      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # 1. Создаем целевой контур папки, куда Flet CLI будет пытаться развернуть 3.44.8
          mkdir -p /home/runner/flutter/3.44.8
          rm -rf /home/runner/flutter/3.44.8/*
          
          # 2. Насильно клонируем/копируем туда стабильное ядро 3.41.7
          cp -r /opt/hostedtoolcache/flutter/stable-3.41.7-x64/flutter/* /home/runner/flutter/3.44.8/
          
          # 3. Фиксируем системный флаг, чтобы Flet думал, что всё готово
          export PATH="/home/runner/flutter/3.44.8/bin:$PATH"
          export FLUTTER_ROOT="/home/runner/flutter/3.44.8"
          
          # 4. Запускаем оригинальный сборщик, который теперь обречен использовать 3.41.7
          flet build apk -v --yes --python-version 3.12 --cleanup-app --cleanup-packages





      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-journal-apk
          path: build/apk/*.apk
