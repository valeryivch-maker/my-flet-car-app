name: Build Android Release (100% Pure Native Flet Engine)
on:
 push:
   branches:
     - main
 workflow_dispatch:
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Чек-аут репозитория
       uses: actions/checkout@v4

     - name: Настройка Java JDK 17
       uses: actions/setup-java@v4
       with:
         distribution: 'zulu'
         java-version: '17'

     - name: Настройка Python 3.12
       uses: actions/setup-python@v5
       with:
         python-version: '3.12'

     - name: Настройка Flutter (Фиксированная версия)
       uses: subosito/flutter-action@v2
       with:
         flutter-version: '3.22.2'
         channel: 'stable'

     - name: 1. Установка компилятора Flet CLI
       run: |
         pip install flet==0.23.2 requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2

     - name: 2. Полный цикл нативной компиляции Android APK
       run: |
         # Очищаем старые артефакты WebView-сборок, если они были
         rm -rf build_flutter flet_web_dist build
         
         # Запуск компилятора Flet, который сам вызовет gradlew внутри своей песочницы
         flet build apk

     - name: 3. Выгрузка готового нативного APK в артефакты GitHub
       uses: actions/upload-artifact@v4
       with:
         name: release-apk
         path: build/apk/app-release.apk
