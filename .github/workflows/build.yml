name: Build Android Release (100% Offline WebView CORS Patched)
on:
 push:
   branches:
     - main
 workflow_dispatch:
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Чек-аут репозитория
       uses: actions/checkout@v4

     - name: Настройка Java JDK 17
       uses: actions/setup-java@v4
       with:
         distribution: 'zulu'
         java-version: '17'

     - name: Настройка Python 3.12
       uses: actions/setup-python@v5
       with:
         python-version: '3.12'

     - name: Настройка Flutter (Фиксированная версия)
       uses: subosito/flutter-action@v2
       with:
         flutter-version: '3.41.7'
         channel: 'stable'

     - name: 1. Установка компилятора Flet CLI в Linux-окружение
       run: |
         pip install flet==0.23.2 requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2

     - name: 2. Подготовка и компиляция Python-кода в режиме чистого HTML
       run: |
         mkdir -p .tmp_web_payload
         python -c "
         import os, shutil
         dest = '.tmp_web_payload'
         for item in os.listdir('.'):
             if item in ['build_flutter', '.github', '.git', '.tmp_web_payload', 'gradle_pip_placeholder']:
                 continue
             if os.path.isfile(item):
                 shutil.copy2(item, os.path.join(dest, item))
             elif os.path.isdir(item):
                 shutil.copytree(item, os.path.join(dest, item), ignore=shutil.ignore_patterns('*.pyc', '__pycache__'), dirs_exist_ok=True)
         "
         cd .tmp_web_payload
         flet publish main.py --web-renderer html --base-url ./ --distpath ../flet_web_dist
         cd ..
         rm -rf .tmp_web_payload
         echo "[УСПЕХ] Python-контур скомпилирован в режиме HTML-рендеринга."

     - name: 3. Создаем чистый Flutter проект с фиксацией ID организации
       run: |
         flutter create --template=app --org com.example --project-name=flet_android --platforms=android build_flutter

     - name: 4. Подключаем официальный базовый плагин webview_flutter от Google
       run: |
         cd build_flutter
         flutter pub add webview_flutter

     - name: 5. Инъекция автономного дистрибутива в ассеты мобильного приложения
       run: |
         mkdir -p build_flutter/assets/www
         cp -r flet_web_dist/* build_flutter/assets/www/
         echo "[УСПЕХ] Веб-дистрибутив зашит во внутреннюю структуру assets/www/"

     - name: 6. Инъекция загрузчика HTML-строки в main.dart через официальный SDK
       run: |
         rm -f build_flutter/lib/main.dart
         cat << 'EOF' > build_flutter/lib/main.dart
         import 'package:flutter/material.dart';
         import 'package:flutter/services.dart';
         import 'package:webview_flutter/webview_flutter.dart';
         
         void main() async {
           WidgetsFlutterBinding.ensureInitialized();
           runApp(const MyApp());
         }
         class MyApp extends StatelessWidget {
           const MyApp({super.key});
           @override
           Widget build(BuildContext context) {
             return MaterialApp(
               title: 'Журнал ТО',
               debugShowCheckedModeBanner: false,
               theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.amber),
               home: const WebViewContainer(),
             );
           }
         }
         class WebViewContainer extends StatefulWidget {
           const WebViewContainer({super.key});
           @override
           State<WebViewContainer> createState() => _WebViewContainerState();
         }
         class _WebViewContainerState extends State<WebViewContainer> {
           late final WebViewController _controller;
           bool _isLoading = true;
         
           @override
           void initState() {
             super.initState();
             _controller = WebViewController()
               ..setJavaScriptMode(JavaScriptMode.unrestricted)
               ..setNavigationDelegate(
                 NavigationDelegate(
                   onPageFinished: (String url) {
                     setState(() {
                       _isLoading = false;
                     });
                   },
                 ),
               );
             _loadHtmlFromAssets();
           }
         
           Future<void> _loadHtmlFromAssets() async {
             try {
               // Читаем скомпилированный index.html напрямую как текстовую строку
               String fileHtmlContents = await rootBundle.loadString('assets/www/index.html');
               
               // Принудительно скармливаем её в официальный WebView от Google
               await _controller.loadHtmlString(fileHtmlContents, baseUrl: 'https://android.com');
             } catch (e) {
               debugPrint("Ошибка чтения ассета: $e");
             }
           }
         
           @override
           Widget build(BuildContext context) {
             return Scaffold(
               backgroundColor: const Color(0xFF1E1E1E),
               body: SafeArea(
                 child: Stack(
                   children: [
                     WebViewWidget(controller: _controller),
                     if (_isLoading)
                       const Center(
                         child: CircularProgressIndicator(color: Colors.amber),
                       ),
                   ],
                 ),
               ),
             );
           }
         }
         EOF

     - name: 7. Жесткая и каноническая генерация путей pubspec.yaml для Flet HTML
       run: |
         cd build_flutter
         rm -f pubspec.yaml
         cat << 'EOF' > pubspec.yaml
         name: flet_android
         description: "An offline Flet Asset project."
         publish_to: 'none'
         version: 1.0.0+1
         environment:
           sdk: '>=3.0.0 <4.0.0'
         dependencies:
           flutter:
             sdk: flutter
           webview_flutter: ^4.10.0
         dev_dependencies:
           flutter_test:
             sdk: flutter
           flutter_lints: ^3.0.0
         flutter:
           uses-material-design: true
           assets:
             - assets/www/
         EOF
         find assets/www -type d | while read -r dir; do
           if [ "$dir" != "assets/www" ]; then
             echo "    - ${dir}/" >> pubspec.yaml
           fi
         done
         echo "[УСПЕХ] Manifest путей pubspec.yaml динамически собран."

     - name: 8. Принудительная прямая компиляция через нативный Gradle-движок
       run: |
         cd build_flutter
         flutter pub get
         cd android
         chmod +x gradlew
         ./gradlew assembleRelease

     - name: 9. Выгрузка готового офлайн APK в артефакты GitHub
       uses: actions/upload-artifact@v4
       with:
         name: release-apk
         path: build_flutter/build/app/outputs/apk/release/app-release.apk
