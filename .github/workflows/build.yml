name: Build Android Release (Flet Web Container)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Flutter (Фиксированная версия)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: 1. Создаем чистый Flutter проект
        run: |
          flutter create --template=app --project-name=flet_android --platforms=android build_flutter

      - name: 2. Подключаем официальный стабильный плагин WebView
        run: |
          cd build_flutter
          flutter pub add webview_flutter

      - name: 3. Перезапись main.dart под высокопроизводительный веб-контейнер
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Журнал ТО',
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.amber),
                home: const WebViewContainer(),
              );
            }
          }

          class WebViewContainer extends StatefulWidget {
            const WebViewContainer({super.key});

            @override
            State<WebViewContainer> createState() => _WebViewContainerState();
          }

          class _WebViewContainerState extends State<WebViewContainer> {
            late final WebViewController _controller;

            @override
            void main() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0x00000000))
                ..loadRequest(Uri.parse('https://raas.su')); // Защищенный отказоустойчивый шлюз
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: _controller),
                ),
              );
            }
          }
          EOF

      - name: 4. Компиляция стабильного Android APK
        run: |
          cd build_flutter
          flutter build apk --release

      - name: 5. Выгрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_flutter/build/app/outputs/flutter-apk/app-release.apk
