name: Build Android Release (Flet Native)
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Flutter (Фиксированная версия)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. Создаем чистый Flutter проект
        run: |
          flutter create --template=app --project-name=flet_android --platforms=android build_flutter

      - name: 2. Подключаем плагин serious_python
        run: |
          cd build_flutter
          flutter pub add serious_python

      - name: 3. Тотальное затирание и перезапись main.dart
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run(appFileName: "main.py");
          }
          EOF

      - name: 4. Скачивание зависимостей Pip во временную директорию
        run: |
          mkdir -p .pip_packages
          pip install requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2 flet-embed==0.23.2 --target .pip_packages

      - name: 5. Сборка ресурсов проекта и упаковка в app.zip
        run: |
          mkdir -p .tmp_app_payload
          
          # Копируем Python-скрипты, JSON и текстовые конфигурации
          python -c "
          import os, shutil
          dest_dir = '.tmp_app_payload'
          for item in os.listdir('.'):
              if item in ['build_flutter', '.github', '.git', '.pip_packages', 'gradle_pip_placeholder']:
                  continue
              if os.path.isfile(item):
                  if item.endswith('.py') or item.endswith('.json') or item.endswith('.txt'):
                      shutil.copy2(item, os.path.join(dest_dir, item))
              elif os.path.isdir(item):
                  shutil.copytree(item, os.path.join(dest_dir, item), ignore=shutil.ignore_patterns('*.pyc', '__pycache__'), dirs_exist_ok=True)
          "
          
          # Копируем внешние pip-пакеты в корень будущего архива
          if [ -d ".pip_packages" ]; then
            cp -r .pip_packages/* .tmp_app_payload/
          fi
          
          # Архивируем контур для интеграции в ассеты serious_python
          mkdir -p build_flutter/assets
          cd .tmp_app_payload
          zip -r ../build_flutter/assets/app.zip ./*
          cd ..
          
          # Очищаем рабочий след
          rm -rf .tmp_app_payload
          echo "[УСПЕХ] Контур приложения запакован в валидный assets/app.zip"

      - name: 6. Очистка временных папок сборщика
        run: |
          mkdir -p gradle_pip_placeholder
          rm -rf .pip_packages

      - name: 7. Полная атомарная перезапись pubspec.yaml с линковкой архива
        run: |
          rm -f build_flutter/pubspec.yaml
          cat << 'EOF' > build_flutter/pubspec.yaml
          name: flet_android
          description: "A new Flet Android project."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            serious_python: ^4.5.1

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/app.zip
          EOF
          echo "[УСПЕХ] pubspec.yaml переведен на обслуживание архивного контура."

      - name: 8. Компиляция стабильного Android APK
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/gradle_pip_placeholder"
        run: |
          cd build_flutter
          flutter build apk --release

      - name: 9. Выгрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_flutter/build/app/outputs/flutter-apk/app-release.apk
