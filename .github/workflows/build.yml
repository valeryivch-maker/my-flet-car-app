      - name: 6. Инъекци канонического WebViewAssetLoader и локалного роутинга Flet
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:webview_flutter_android/webview_flutter_android.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Журнал ТО',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.amber),
                home: const WebViewContainer(),
              );
            }
          }

          class WebViewContainer extends StatefulWidget {
            const WebViewContainer({super.key});

            @override
            State<WebViewContainer> createState() => _WebViewContainerState();
          }

          class _WebViewContainerState extends State<WebViewContainer> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();

              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (String url) {
                      setState(() {
                        _isLoading = false;
                      });
                    },
                  ),
                );

              if (_controller.platform is AndroidWebViewController) {
                final AndroidWebViewController androidController = _controller.platform as AndroidWebViewController;
                
                // Включаем поддержку медиа и USB-отладки (chrome://inspect на ПК)
                androidController.setMediaPlaybackRequiresUserGesture(false);
                AndroidWebViewController.enableDebugging(true);

                // Жесткая привязка нативного WebViewAssetLoader к папке assets/www
                androidController.setPlatformWebViewClient(
                  AndroidWebViewClient(
                    AndroidWebViewClientCreationParams(
                      onPageFinished: (String url) {
                        setState(() {
                          _isLoading = false;
                        });
                      },
                    ),
                  )..setAssetLoader(
                      AndroidWebViewAssetLoader(
                        domain: '://android.com',
                        pathHandlers: [
                          AndroidAssetsPathHandler(
                            context: null, // Контекст автоматически инжектируется нативным слоем
                            assetsPath: 'www', // Ссылка на внутренний каталог assets/www/
                          ),
                        ],
                      ),
                    ),
                );
              }

              // Загрузка локальной точки входа Flet через защищенный виртуальный домен
              _controller.loadRequest(
                Uri.parse('https://://android.com/index.html')
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF1E1E1E),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(color: Colors.amber),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF
