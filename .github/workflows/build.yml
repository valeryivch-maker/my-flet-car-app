name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Фиксируем стабильный Flutter 3.41.7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # Настраиваем Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Toolchain Dependencies (GTK 3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      # Ставим актуальный стабильный Flet
      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[cli]"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # Удаляем временные папки прошлых нативных попыток, чтобы очистить контур
      - name: Clean environment
        run: |
          rm -rf build_flutter
          rm -rf build_dependencies
          rm -f app.py patch*.py generate*.py

      # Запускаем сборку Flet, жестко указав путь к нашему кэшированному Flutter 3.41.7
      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          flet build apk -v --yes --python-version 3.12 --cleanup-app --cleanup-packages
