name: Build Android Release (100% Pure Native Flet Engine)
on:
 push:
   branches:
     - main
 workflow_dispatch:
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Чек-аут репозитория
       uses: actions/checkout@v4

     - name: Настройка Java JDK 17
       uses: actions/setup-java@v4
       with:
         distribution: 'zulu'
         java-version: '17'

     - name: Настройка Python 3.12
       uses: actions/setup-python@v5
       with:
         python-version: '3.12'

     - name: Настройка Flutter (Фиксированная версия)
       uses: subosito/flutter-action@v2
       with:
         flutter-version: '3.22.2'
         channel: 'stable'

     - name: 1. Установка компилятора Flet CLI
       run: |
         pip install flet==0.23.2 requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2

     - name: 2. Подготовка и компиляция чистого нативного Android-проекта
       run: |
         # Очищаем старые артефакты WebView-сборок, если они были
         rm -rf build_flutter flet_web_dist build
         
         # Канонический запуск нативного сборщика Flet для текущей директории (.)
         flet build apk
         
         # Перемещаем сгенерированный нативный проект в рабочую директорию конвейера
         mv build/apk build_flutter
         echo "[УСПЕХ] Создана чистая нативная структура Flet-приложения."

     - name: 3. Принудительная прямая компиляция через нативный Gradle-движок
       run: |
         cd build_flutter/android
         chmod +x gradlew
         ./gradlew assembleRelease

     - name: 4. Выгрузка готового 100% нативного APK в артефакты GitHub
       uses: actions/upload-artifact@v4
       with:
         name: release-apk
         path: build_flutter/android/app/build/outputs/apk/release/app-release.apk
