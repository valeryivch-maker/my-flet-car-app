
name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Фиксируем стабильную версию Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # Разворачиваем целевой Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Принимаем лицензии Android SDK
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # Очищаем репозиторий от лишних скриптов
      - name: Hard Purge Non-Core Python Files
        run: |
          rm -f app.py
          rm -f cron_weekly_check.py
          rm -f patch*.py
          rm -f generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены."

      # Нативная сборка с правильным Dart-рантаймом под вызов Serious Python
      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # 1. Создаем чистый Flutter проект
          flutter create --template=app --platforms=android build_flutter
          
          # 2. Подключаем официальный плагин serious_python в конфигурацию проекта
          cd build_flutter
          flutter pub add serious_python
          
          # 3. Полностью перезаписываем main.dart, чтобы он запускал наш Python-рантайм
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';
          
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run("assets/app/app.zip");
          }
          EOF
          
          # 4. Возвращаемся в корень и изолированно скачиваем внешние зависимости приложения под Android
          cd ..
          mkdir -p build_dependencies
          pip install requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2 --target build_dependencies
          
          # 5. Упаковываем весь наш Python-код в архив app.zip внутрь ассетов Flutter
          mkdir -p build_flutter/assets/app
          python -c "
          import zipfile, os
          with zipfile.ZipFile('build_flutter/assets/app/app.zip', 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk('.'):
                  if 'build_flutter' in root or 'build_dependencies' in root or '.github' in root or '.git' in root:
                      continue
                  for file in files:
                      if file.endswith('.py') or file.endswith('.json') or file.endswith('.txt'):
                          fp = os.path.join(root, file)
                          zipf.write(fp, os.path.relpath(fp, '.'))
          print('[УСПЕХ] Архивация Python-модулей выполнена успешно.')
          "
          
          # 6. Инжектируем ассет в уже существующую секцию flutter: с правильными отступами
          cd build_flutter
          sed -i '/^flutter:/a \  assets:\n    - assets/app/app.zip' pubspec.yaml
          
          # 7. Экспортируем обязательную для Gradle переменную пути к библиотекам и запускаем компиляцию
          export SERIOUS_PYTHON_SITE_PACKAGES="/home/runner/work/my-flet-car-app/my-flet-car-app/build_dependencies"
          flutter build apk --release

      # Выгружаем готовый рабочий APK-файл
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-journal-apk
          path: "**/app-release.apk"
