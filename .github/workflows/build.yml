name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Toolchain Dependencies (GTK 3.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install Flet with CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet[cli]"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Hard Purge Non-Core Python Files
        run: |
          rm -f app.py
          rm -f cron_weekly_check.py
          rm -f patch*.py
          rm -f generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены перед сборкой хуков."

      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # 1. Запускаем компиляцию python-кода через нативный serious_python напрямую, как это делал flet
          dart run serious_python:main package /home/runner/work/my-flet-car-app/my-flet-car-app --platform Android --python-version 3.12 --arch arm64-v8a,x86_64,armeabi-v7a -r flet==0.23.2 --exclude build --compile-app --compile-packages --cleanup-app --cleanup-packages

          # 2. Переходим в сгенерированный flutter-шаблон и вызываем жестко зафиксированный компилятор SDK 3.41.7
          cd build/flutter
          /opt/hostedtoolcache/flutter/stable-3.41.7-x64/flutter/bin/flutter build apk --release



      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-journal-apk
          path: build/apk/*.apk
