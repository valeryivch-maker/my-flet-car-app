name: Build Android Release (Flet Native)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Настройка Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настройка Flutter (Фиксированная версия)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Настройка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 1. Создаем чистый Flutter проект
        run: |
          flutter create --template=app --platforms=android build_flutter

      - name: 2. Подключаем плагин serious_python
        run: |
          cd build_flutter
          flutter pub add serious_python

      - name: 3. Тотальное затирание и перезапись main.dart
        run: |
          rm -f build_flutter/lib/main.dart
          cat << 'EOF' > build_flutter/lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';
          
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run();
          }
          EOF

      - name: 4. Скачивание зависимостей Pip во временную директорию
        run: |
          mkdir -p .pip_packages
          pip install requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2 flet-embed==0.23.2 --target .pip_packages

      - name: 5. Упаковка кода в гарантированный ассет Flutter
        run: |
          mkdir -p build_flutter/assets
          python -c "
          import zipfile, os
          
          target_zip = os.path.abspath('build_flutter/assets/app.zip')
          
          with zipfile.ZipFile(target_zip, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for item in os.listdir('.'):
                  if item in ['build_flutter', '.github', '.git', '.pip_packages', 'gradle_pip_placeholder']:
                      continue
                  if os.path.isfile(item):
                      if item.endswith('.py') or item.endswith('.json') or item.endswith('.txt'):
                          zipf.write(item, item)
                  elif os.path.isdir(item):
                      for root, dirs, files in os.walk(item):
                          for file in files:
                              if file.endswith('.py') or file.endswith('.json') or file.endswith('.txt'):
                                  fp = os.path.join(root, file)
                                  zipf.write(fp, os.path.relpath(fp, '.'))
              
              sp_dir = '.pip_packages'
              if os.path.exists(sp_dir):
                  for root, dirs, files in os.walk(sp_dir):
                      for file in files:
                          fp = os.path.join(root, file)
                          arc_name = os.path.relpath(fp, sp_dir)
                          zipf.write(fp, arc_name)
                          
          print('[УСПЕХ] Архив app.zip успешно упакован без корневых смещений.')
          "

      - name: 6. Очистка временных папок сборщика
        run: |
          mkdir -p gradle_pip_placeholder
          rm -rf .pip_packages

      - name: 7. Корректировка окружения SDK и атомарный линк ассетов
        run: |
          python -c "
          pub_path = 'build_flutter/pubspec.yaml'
          with open(pub_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
          
          out = []
          skip_env = False
          for line in lines:
              # Переводим блок environment на безопасный плавающий диапазон
              if 'environment:' in line:
                  out.append(line)
                  out.append('  sdk: \'>=3.0.0 <4.0.0\'\n')
                  skip_env = True
                  continue
              if skip_env and line.strip().startswith('sdk:'):
                  continue
              if skip_env and not line.startswith(' ') and line.strip():
                  skip_env = False
              out.append(line)
          
          # Намертво инжектируем блок ассетов в конец оригинального pubspec
          out.append('\nflutter:\n')
          out.append('  uses-material-design: true\n')
          out.append('  assets:\n')
          out.append('    - assets/app.zip\n')
          
          with open(pub_path, 'w', encoding='utf-8') as f:
              f.writelines(out)
          print('[УСПЕХ] pubspec.yaml успешно модифицирован с сохранением метаданных.')
          "

      - name: 8. Компиляция стабильного Android APK
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: "/home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/gradle_pip_placeholder"
        run: |
          cd build_flutter
          flutter build apk --release

      - name: 9. Выгрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_flutter/build/app/outputs/flutter-apk/app-release.apk
