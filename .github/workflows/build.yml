name: CI Production Clean Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Фиксируем стабильную версию Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'

      # Разворачиваем целевой Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Принимаем лицензии Android SDK
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # Очищаем репозиторий от лишних файлов прошлого билда
      - name: Hard Purge Non-Core Python Files
        run: |
          rm -rf build_flutter
          rm -rf build_dependencies
          rm -f app.py cron_weekly_check.py patch*.py generate*.py
          echo "[CI/CD] Второстепенные скрипты принудительно удалены."

      # Нативная сборка Flutter-приложения с интеграцией Python-кода без использования Flet CLI
      - name: Build Android APK Package
        env:
          PYTHONHTTPSVERIFY: "0"
        run: |
          # 1. Создаем чистый Flutter проект
          flutter create --template=app --platforms=android build_flutter
          
          # 2. Подключаем плагин serious_python
          cd build_flutter
          flutter pub add serious_python
          
          # 3. Перезаписываем main.dart с использованием именованного аргумента assetPath
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:serious_python/serious_python.dart';
          
          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SeriousPython.run(assetPath: "assets/app/app.zip");
          }
          EOF
          
          # 4. Возвращаемся в корень и скачиваем внешние библиотеки прямо в будущую структуру ассетов
          cd ..
          mkdir -p build_flutter/assets/app
          pip install requests==2.32.3 certifi==2024.7.4 urllib3==2.2.2 flet-embed==0.23.2 --target build_flutter/assets/app/site-packages
          
          # 5. Упаковываем ваш Python-код в архив app.zip вместе со скачанными зависимостями
          python -c "
          import zipfile, os
          with zipfile.ZipFile('build_flutter/assets/app/app.zip', 'w', zipfile.ZIP_DEFLATED) as zipf:
              # Сначала упаковываем чистый код проекта
              for root, dirs, files in os.walk('.'):
                  if 'build_flutter' in root or '.github' in root or '.git' in root:
                      continue
                  for file in files:
                      if file.endswith('.py') or file.endswith('.json') or file.endswith('.txt'):
                          fp = os.path.join(root, file)
                          zipf.write(fp, os.path.relpath(fp, '.'))
              
              # Затем упаковываем скачанные библиотеки site-packages внутрь архива
              sp_dir = 'build_flutter/assets/app/site-packages'
              for root, dirs, files in os.walk(sp_dir):
                  for file in files:
                      fp = os.path.join(root, file)
                      arc_name = os.path.relpath(fp, sp_dir)
                      zipf.write(fp, arc_name)
          print('[УСПЕХ] Python-код и все зависимости упакованы в app.zip.')
          "
          
          # Создаем пустую изолированную папку-заглушку для Gradle-валидатора
          mkdir -p gradle_pip_placeholder
          
          # Переносим временную папку site-packages, чтобы она не дублировалась в ассетах Flutter
          rm -rf build_flutter/assets/app/site-packages
          
          # 6. Инжектируем ассет в существующую секцию flutter: в pubspec.yaml
          cd build_flutter
          sed -i '/^flutter:/a \  assets:\n    - assets/app/app.zip' pubspec.yaml
          
          # 7. ИСПРАВЛЕНО: Экспортируем переменную окружения и запускаем компиляцию
          export SERIOUS_PYTHON_SITE_PACKAGES="/home/runner/work/my-flet-car-app/my-flet-car-app/gradle_pip_placeholder"
          flutter build apk --release

      # Выгружаем готовый рабочий APK-файл
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-journal-apk
          path: "**/app-release.apk"
