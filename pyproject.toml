[tool.flet]
product = "Бортовой Журнал"
package = "com.flet.carjournal"
version = "1.3.0"
build_number = 14

[tool.flet.app]
main_script = "main_test.py"

[tool.flet.android]
min_sdk_version = 23
target_sdk_version = 33
compile_sdk_version = 34
extract_packages = ["requests", "urllib3", "certifi", "plyer", "charset_normalizer", "idna"]

[tool.flet.splash]
color = "#ffffff"
dark_color = "#0a0a1e"
min_duration = 10.0